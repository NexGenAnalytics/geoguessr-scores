name: Deploy dashboard

on:
  push:
    branches: [main]
    # Redeploy when the data or the dashboard itself changes.
    paths:
      - scores.csv
      - site/**
      - tests/dashboard/**
      - package.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test dashboard stats
        run: npm test

      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp scores.csv _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
